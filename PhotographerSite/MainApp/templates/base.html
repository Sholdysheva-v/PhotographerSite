{% load static %}
{% load photo_tags %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Фотоуслуги{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="{% url 'index' %}" class="logo">Фотоуслуги</a>
                <nav>
                    <ul>
                        <li><a href="{% url 'index' %}" class="">Главная</a></li>
                        <li><a href="{% url 'order' 1 %}" class="">Мой заказ</a></li>
                        <li><a href="#">О нас</a></li>
                        <li><a href="#">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>© {% now "Y" %} </p>
        </div>
    </footer>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
